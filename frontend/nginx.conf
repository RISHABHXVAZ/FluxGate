server {
    listen 80;
    server_name localhost;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream_api http://gateway:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_header X-RateLimit-Limit;
        proxy_pass_header X-RateLimit-Remaining;
        proxy_pass_header X-RateLimit-Reset;
        proxy_pass_header Retry-After;
    }

    location /health {
        set $upstream_health http://gateway:8080/health;
        proxy_pass $upstream_health;
    }

    location /ready {
        set $upstream_ready http://gateway:8080/ready;
        proxy_pass $upstream_ready;
    }

    location /metrics {
        set $upstream_metrics http://gateway:8080/metrics;
        proxy_pass $upstream_metrics;
    }
}
